name: CI Security & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Build production applet
        run: npm run build

      - name: Verify no mock verifier strings leaked to production bundle
        run: |
          if grep -rn "mockVerifier" dist/; then
            echo "ERROR: Found mockVerifier in production build bundle!"
            exit 1
          fi
