name: CI Security & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Verify Vercel Serverless ESM routes load cleanly in native Node ESM
        run: npm run check:esm

      - name: Ensure zero relative imports lack .js in api/ and lib/
        run: |
          BAD_IMPORTS=$(grep -rnE 'from\s+["'"'"']\.[^"'"'"']+' api/ lib/ | grep -v '\.js["'"'"']' || true)
          if [ -n "$BAD_IMPORTS" ]; then
            echo "ERROR: Found relative imports lacking .js extension in api/ or lib/:"
            echo "$BAD_IMPORTS"
            exit 1
          fi
          echo "Verified: All relative imports in api/ and lib/ end with .js."

      - name: Vercel Serverless ESM Smoke Test (GET /api/protocol/config)
        run: |
          npx esbuild api/**/*.ts lib/**/*.ts src/constants/adminPubkeys.ts --format=esm --platform=node --packages=external --outdir=.esm-smoke
          node --input-type=module -e "
            const configMod = await import('./.esm-smoke/api/protocol/config.js');
            let statusCode = 0;
            let responseData = null;
            const req = { method: 'GET', headers: {} };
            const res = {
              status(code) { statusCode = code; return this; },
              json(data) { responseData = data; return this; },
              setHeader() {}
            };
            await configMod.default(req, res);
            if (statusCode !== 200 || typeof responseData?.baseFeeRatePcm !== 'number') {
              console.error('ERROR: ESM Smoke test failed for GET /api/protocol/config! Status:', statusCode, responseData);
              process.exit(1);
            }
            console.log('SUCCESS: GET /api/protocol/config returned 200 on compiled Vercel ESM, baseFeeRatePcm:', responseData.baseFeeRatePcm);
          "
          rm -rf .esm-smoke

      - name: Verify data/protocol_config.json was not modified by tests
        run: git diff --exit-code data/protocol_config.json

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Build production applet
        run: npm run build

      - name: Verify no mock verifier strings leaked to production bundle
        run: |
          if grep -rn "mockVerifier" dist/; then
            echo "ERROR: Found mockVerifier in production build bundle!"
            exit 1
          fi

      - name: Production Server Smoke Test (without devDependencies)
        run: |
          mkdir -p /tmp/smoke-test
          cp -r package.json package-lock.json dist data public /tmp/smoke-test/
          cd /tmp/smoke-test
          npm ci --omit=dev
          NODE_ENV=production PORT=3847 node dist/server.cjs &
          SERVER_PID=$!
          sleep 3
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3847/api/health)
          CONFIG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3847/api/protocol/config)
          kill $SERVER_PID 2>/dev/null || true
          rm -rf /tmp/smoke-test
          if [ "$HEALTH_STATUS" != "200" ] || [ "$CONFIG_STATUS" != "200" ]; then
            echo "ERROR: Production server smoke test failed! Health: $HEALTH_STATUS, Config: $CONFIG_STATUS"
            exit 1
          fi
          echo "Production server smoke test passed successfully."
